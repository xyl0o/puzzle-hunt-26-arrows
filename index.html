<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f0eceb;
    --cell: #f6f2f1;
    --ink: #131a2b;
    --ink-soft: #5b6275;
    --trace: #2447e8;
    --wash: #dbe3ff;
    --land: #a9bbff;
    --wash-black: #2a3a86;
    --gap: clamp(16px, 2.5vw, 40px);
    --scale: 1;
    --size: calc(min(100vh - 170px, 42vw, 720px) * var(--scale));
    --gw: clamp(17px, 1.95vw, 28px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: var(--gap);
    padding: 4vh var(--gap);
  }
  @media (max-width: 700px) { :root { --gap: 8px; } }

  /* ---------- title and board ---------- */
  .center { display: flex; flex-direction: column; align-items: center; gap: 30px; min-width: 0; }
  .titlebar { width: var(--size); min-width: min(100%, 320px); }
  .titlebar ul { list-style: none; margin: 0; padding: 0; }
  .path.title { grid-template-columns: auto 1fr; }
  .path.title .label { text-align: left; }
  /* ---------- board ---------- */
  .board { position: relative; width: var(--size); height: var(--size); }
  #grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    border: 2px solid var(--ink);
    background: var(--ink);
    gap: 2px;
  }
  .cell { position: relative; background: var(--cell); transition: background-color .12s; }
  .cell.black { background: var(--ink); }
          .files, .ranks {
    position: absolute;
    display: grid;
    gap: 2px;
    color: var(--ink-soft);
    font-size: clamp(10px, calc(var(--size) / 9 * 0.17), 14px);
    font-weight: 500;
    pointer-events: none;
    user-select: none;
  }
  .files { left: 2px; right: 2px; bottom: 100%; margin-bottom: 4px; grid-template-columns: repeat(9, 1fr); text-align: center; }
  .ranks { top: 2px; bottom: 2px; right: 100%; margin-right: 6px; grid-template-rows: repeat(9, 1fr); align-items: center; }
  .num {
    position: absolute;
    top: 3%;
    left: 6%;
    font-size: calc(var(--size) / 9 * 0.17);
    pointer-events: none;
    line-height: 1;
    z-index: 1;
  }
  .cell .notes {
    position: absolute;
    inset: 5%;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    place-items: center;
    pointer-events: none;
    font-size: calc(var(--size) / 9 * 0.2);
    font-weight: 500;
    line-height: 1;
    text-transform: uppercase;
    color: var(--ink);
    opacity: .42;
  }
  .cell input {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    text-align: center;
    text-transform: uppercase;
    font: inherit;
    font-weight: 500;
    font-size: calc(var(--size) / 9 * 0.55);
    color: var(--ink);
    padding: 12% 0 0;
    caret-color: transparent;
    outline: none;
  }
  .cell input:focus { box-shadow: inset 0 0 0 2px var(--ink); }
  .cell .pen {
    all: unset;
    position: absolute;
    top: 4%;
    right: 4%;
    width: 24%;
    height: 24%;
    display: none;
    place-items: center;
    box-sizing: border-box;
    border-radius: 4px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    z-index: 2;
  }
  .cell .pen svg { width: 68%; height: 68%; }
  .cell.xhl .pen { display: grid; }
  .cell .pen:hover { background: var(--trace); }
  body.notes-off .cell .notes, body.notes-off .cell .pen { display: none !important; }
  /* the enlarged cell for notes */
  #noteBox {
    position: fixed;
    z-index: 30;
    box-sizing: border-box;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    gap: 2px;
    border: 2px solid var(--ink);
    background: var(--ink);
    box-shadow: 0 12px 40px rgba(19, 26, 43, .35);
  }
  #noteBox[hidden] { display: none; }
  #noteBox .note {
    all: unset;
    box-sizing: border-box;
    min-width: 0;
    background: var(--cell);
    color: var(--ink);
    text-align: center;
    text-transform: uppercase;
    font-weight: 500;
    caret-color: transparent;
  }
  #noteBox .note:focus { background: var(--wash); }
  #noteBox .nclose {
    all: unset;
    position: absolute;
    top: -14px;
    right: -14px;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font: 500 18px/1 "DM Sans", system-ui, sans-serif;
    cursor: pointer;
  }
  #noteBox .nclose:hover { background: var(--trace); }
  #noteBox .nclose:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }
  #noteBox .ntag { position: absolute; left: -2px; bottom: 100%; margin-bottom: 4px; font-size: 13px; font-weight: 500; color: var(--ink); }
  #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* ---------- path lists ---------- */
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; max-height: 92vh; width: 100%; }
  .col.left { justify-self: end; }
  .col.right { justify-self: start; }
  .colhead { flex: none; margin: 0 0 0 8px; color: var(--ink); line-height: 0; }
  .colhead svg { display: block; height: 30px; width: auto; }
  .col.right .colhead svg { height: 56px; }
  .panel { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 4px; scrollbar-width: thin; }
  .source { display: grid; gap: 4px; }
  #settingsPanel .sync { display: grid; gap: 6px; font-size: 14px; }
  #settingsPanel .sync input {
    box-sizing: border-box;
    width: 100%;
    padding: 5px 8px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 6px;
    background: var(--cell);
    color: var(--ink);
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #settingsPanel .sync input:focus { outline: 2px solid var(--trace); outline-offset: 1px; border-color: var(--trace); }
  #settingsPanel .sync p { margin: 0; font-size: 12px; line-height: 1.3; color: var(--ink-soft); min-height: 1.3em; }
  .codes { display: grid; gap: 14px; padding-top: 12px; border-top: 1.5px solid rgba(91, 98, 117, .35); }
  .srclabel { font-size: 14px; }
  .source textarea {
    width: 100%;
    min-height: 4.6em;
    resize: vertical;
    padding: 6px 8px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 6px;
    background: var(--cell);
    color: var(--ink);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .source textarea:focus { outline: 2px solid var(--trace); outline-offset: 1px; border-color: var(--trace); }
  .source textarea[aria-invalid="true"] { border-color: #c4302b; }
  .source .foot { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .source .err { margin: 0; min-height: 1.3em; font-size: 12px; line-height: 1.3; color: #c4302b; }
  .source .reset {
    all: unset;
    flex: none;
    box-sizing: border-box;
    padding: 2px 8px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.3;
    cursor: pointer;
  }
  .source .reset:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .source .reset:focus-visible { outline: 2px solid var(--trace); outline-offset: 1px; }
  .source .reset:disabled { opacity: .4; cursor: default; }
  .panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .path {
    box-sizing: border-box;
    width: 100%;
    display: grid;
    grid-template-columns: 2.4em 1fr;
    align-items: start;
    gap: 6px;
    padding: 6px 8px 4px 6px;
    border-radius: 6px;
    cursor: pointer;
  }
  .path:hover { background: rgba(19, 26, 43, .06); }
  .path.active { background: var(--ink); color: var(--paper); box-shadow: inset 5px 0 0 var(--pc, var(--trace)); }
  .path .label {
    all: unset;
    cursor: pointer;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    text-align: right;
    font-variant-numeric: tabular-nums;
    line-height: 28px;
  }
  .path .label:focus-visible { outline: 2px solid var(--trace); outline-offset: 1px; }
  .words { display: flex; flex-wrap: wrap; gap: 4px calc(var(--gw) * .7); }
  .word { display: flex; flex-wrap: nowrap; flex: none; white-space: nowrap; border-top: 3px solid transparent; padding-top: 3px; }
  .path.active .word { border-top-color: var(--wc, transparent); }
  .g { display: flex; flex-direction: column; align-items: center; width: var(--gw); }
  .g.tick { width: 12px; }
  .g svg { width: var(--gw); height: var(--gw); display: block; overflow: visible; }
  .g.tick svg { width: 12px; }
  .letter {
    all: unset;
    box-sizing: border-box;
    cursor: text;
    width: calc(var(--gw) * .8);
    height: calc(var(--gw) * .8);
    margin-top: 1px;
    border-bottom: 1.5px solid var(--ink-soft);
    caret-color: transparent;
    text-align: center;
    font-size: calc(var(--gw) * .55);
    font-weight: 600;
    line-height: calc(var(--gw) * .75);
    text-transform: uppercase;
  }
  .letter:focus { border-bottom-color: var(--trace); background: var(--wash); }
  .coord {
    margin-top: 1px;
    font-size: calc(var(--gw) * .36);
    line-height: 1;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .lead { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .fold {
    all: unset;
    box-sizing: border-box;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .fold:hover { background: rgba(19, 26, 43, .1); color: var(--ink); }
  .fold:focus-visible { outline: 2px solid var(--trace); outline-offset: 1px; }
  .path.active .fold { color: rgba(240, 236, 235, .7); }
  .path.active .fold:hover { background: rgba(240, 236, 235, .18); color: var(--paper); }
  .fold svg { width: 12px; height: 12px; transition: transform .15s; }
  .path.collapsed .fold svg { transform: rotate(-90deg); }
  .path.collapsed .words { display: none; }
  .path.collapsed .solution { margin-top: 3px; }
  .body { min-width: 0; }
  .solution { display: flex; flex-wrap: nowrap; margin-top: 8px; white-space: nowrap; }
  .solution .letter { border: 1.5px solid var(--ink-soft); border-radius: 4px; height: calc(var(--gw) * .85); line-height: calc(var(--gw) * .8); }
  .path.active .solution .letter { border-color: rgba(240, 236, 235, .55); }
  .path.active .coord { color: rgba(240, 236, 235, .6); }
  .path.active .letter { border-bottom-color: rgba(240, 236, 235, .55); }
  .path.active .letter:focus { border-bottom-color: var(--paper); background: rgba(240, 236, 235, .18); }
  /* the field that has focus, marked everywhere it appears */
  .cell.xhl { outline: 4px solid var(--ink); outline-offset: -4px; z-index: 1; }
  .cell.xhl::after { content: ''; position: absolute; inset: 0; background: rgba(255, 196, 0, .38); pointer-events: none; }
  .letter.xhl { background: #ffd84d; border-color: var(--ink); color: var(--ink); outline: 2px solid var(--ink); outline-offset: 1px; }
  .path.active .letter.xhl { background: #ffd84d; border-color: var(--ink); color: var(--ink); outline-color: var(--paper); }
  .g.xhl .coord, .path.active .g.xhl .coord { color: var(--ink); font-weight: 700; }
  .path.active .g.xhl .coord { background: #ffd84d; border-radius: 2px; }
  .empty { margin: 0; padding: 8px; max-width: 26ch; color: var(--ink-soft); font-size: 14px; line-height: 1.45; }

  .settings { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .settings > button {
    all: unset;
    box-sizing: border-box;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    background: var(--cell);
    color: var(--ink);
    cursor: pointer;
  }
  .settings > button:hover, .settings > button[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .settings > button:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }
  .settings svg { width: 20px; height: 20px; }
  #settingsPanel {
    width: min(440px, calc(100vw - 24px));
    max-height: calc(100vh - 70px);
    overflow-y: auto;
    padding: 14px 16px 12px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 10px;
    background: var(--paper);
    box-shadow: 0 6px 24px rgba(19, 26, 43, .14);
    display: grid;
    gap: 12px;
  }
  #settingsPanel[hidden] { display: none; }
  #settingsPanel label { display: grid; grid-template-columns: 1fr auto; row-gap: 4px; font-size: 14px; }
  #settingsPanel output { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #settingsPanel input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--trace); }
  #settingsPanel fieldset.modes { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 14px; }
  #settingsPanel .modes legend { padding: 0; margin-bottom: 6px; }
  #settingsPanel label.opt { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #settingsPanel label.opt input { accent-color: var(--trace); margin: 0; }
  #settingsPanel .back {
    all: unset;
    justify-self: start;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
  }
  #settingsPanel .back:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .cell, .fold svg { transition: none; } }
</style>
</head>
<body>
<div class="settings">
  <button type="button" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5h0a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
  </button>
  <div id="settingsPanel" role="group" aria-label="Settings" hidden>
    <label>Grid size <output id="outSize"></output><input type="range" id="setSize" min="50" max="100" step="1"></label>
    <label>Roundness <output id="outRound"></output><input type="range" id="setRound" min="0" max="2" step="0.05"></label>
    <label>Thickness <output id="outThick"></output><input type="range" id="setThick" min="0.5" max="3" step="0.1"></label>
    <label>Transparency <output id="outTransp"></output><input type="range" id="setTransp" min="0" max="80" step="1"></label>
    <label class="opt"><input type="checkbox" id="setNotes"> Show notes</label>
    <fieldset class="modes">
      <legend>Where arrows start and land</legend>
      <label class="opt"><input type="radio" name="mode" value="diagonal"> Diagonal</label>
      <label class="opt"><input type="radio" name="mode" value="direction"> Direction</label>
      <label class="opt"><input type="radio" name="mode" value="small"> Random, small</label>
      <label class="opt"><input type="radio" name="mode" value="big"> Random, big</label>
    </fieldset>
    <button type="button" class="back" id="setDefault">Back to default look</button>
    <div class="sync">
      <label for="setRoom">Room code</label>
      <input type="text" id="setRoom" maxlength="40" spellcheck="false" autocomplete="off" autocapitalize="off">
      <p id="roomStatus" aria-live="polite"></p>
    </div>
    <div class="codes">
    <div class="source">
      <span class="srclabel" id="lblT">Title codes</span>
      <textarea id="rawT" aria-labelledby="lblT" spellcheck="false"></textarea><div class="foot"><p class="err" id="errT" aria-live="polite"></p><button type="button" class="reset" id="resetT">Reset to defaults</button></div></div>
    <div class="source">
      <span class="srclabel" id="lblA">First set codes</span>
      <textarea id="rawA" aria-labelledby="lblA" spellcheck="false"></textarea><div class="foot"><p class="err" id="errA" aria-live="polite"></p><button type="button" class="reset" id="resetA">Reset to defaults</button></div></div>
    <div class="source">
      <span class="srclabel" id="lblB">Second set codes</span>
      <textarea id="rawB" aria-labelledby="lblB" spellcheck="false"></textarea><div class="foot"><p class="err" id="errB" aria-live="polite"></p><button type="button" class="reset" id="resetB">Reset to defaults</button></div></div>
    </div>
  </div>
</div>
<section class="col left">
  <h2 class="colhead"><svg viewBox="0 0 72 28" role="img" aria-label="First set, read left to right" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14H66M54 4l12 10-12 10"/></svg></h2>
  <nav class="panel" aria-label="First set of paths"><ul id="setA"></ul><p class="empty" hidden>The first set of paths goes here.</p></nav>
</section>
<div class="center">
  <nav class="titlebar" aria-label="Title"><ul id="setT"></ul><p class="empty" hidden>The title goes here.</p></nav>
  <main class="board">
    <div id="grid"></div>
    <svg id="overlay" aria-hidden="true"></svg>
  </main>
</div>
<section class="col right">
  <h2 class="colhead"><svg viewBox="0 0 28 72" role="img" aria-label="Second set, read top to bottom" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4V66M4 54l10 12 10-12"/></svg></h2>
  <nav class="panel" aria-label="Second set of paths"><ul id="setB"></ul><p class="empty" hidden>The second set of paths goes here.</p></nav>
</section>

<script>
  /* ---------- puzzle input ----------
     Pasted exactly as received. "<number>." starts an arrow line, "/" separates
     words, spaces separate arrows, "." is stay and "'" is a tick mark. */
  const RAW_A = `e1.ee se sw e w ne n5.e se ne ss / ww e e nn / sw s / ne w wsw ese ssw s ne nwnw w s9.e w ene / e ss wnw e s ne n10.. ss nn . sse e11.e e nne .12.ee w w ese13.ne e n . w e14.ee e e15.. ee nn nw ene17.nwnw se e se s ssw nn nene21.ee ene s s24.wsw n n s s w s nw e25.ne nene nwnw s nn / ene s s . n w26.. wnw nw / wnw nnw n ene se w27.nn e e nn ' swsw / nene n w28.wnw n nw sse`;
  const RAW_T = `. ese nn sw wnw nnw / ss nw w nne n ee ssw ssw wsw sse`;   // the title; its start is worked out from the grid
  const RAW_B = `s1.ese ss sese n ene2.sse w s sese ssw ne3.ssw n e e / n s w e4.. ww sw ese nn5.s sse w ene ww6.s ssw n ssw ese se wnw ww nw / nnw sw s ene s nn wsw nn7.wsw ss s / nw ene sw n ese8.ww se s ww ssw n / . wnw nn se14.e ene se wnw16.. w nwnw nene se nw18.s ene . s n .19.nne wnw sw nn sse e20.sw s nnw w21.nene e ss nnw e s s22.nn nne e23.nnw nnw ss ss nne nnw ss `;

  /* ---------- grid ---------- */
  const N = 9;
  const BLACK = [
    [1,5],[2,5],[3,5],
    [4,4],
    [5,7],[5,8],[5,9],
    [6,1],[6,2],[6,3],
    [7,6],[8,6],[9,6],
  ];
  const FILES = 'ABCDEFGHI';
  const ROWS_FROM_TOP = true;   // true: row 1 is the top row; false: rank 1 at the bottom, like a chess board
  const coord = (r, c) => FILES[c - 1] + (ROWS_FROM_TOP ? r : N + 1 - r);
  const isBlack = (r, c) => BLACK.some(([br, bc]) => br === r && bc === c);
  const open = (r, c) => r >= 1 && r <= N && c >= 1 && c <= N && !isBlack(r, c);

  const grid = document.getElementById('grid');
  const inputs = {};
  const cells = {};
  const cellOfNumber = {};
  let n = 0;

  for (let r = 1; r <= N; r++) {
    for (let c = 1; c <= N; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cells[r + ',' + c] = cell;
      if (isBlack(r, c)) {
        cell.classList.add('black');
      } else {
        const startsAcross = !open(r, c - 1) && open(r, c + 1);
        const startsDown = !open(r - 1, c) && open(r + 1, c);
        if (startsAcross || startsDown) {
          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = ++n;
          cell.appendChild(num);
          cellOfNumber[n] = [r, c];
        }
        const layer = document.createElement('div');
        layer.className = 'notes';
        layer.setAttribute('aria-hidden', 'true');
        for (let i = 0; i < 9; i++) layer.appendChild(document.createElement('span'));
        cell.appendChild(layer);
        const input = document.createElement('input');
        input.maxLength = 1;
        input.autocomplete = 'off';
        input.spellcheck = false;
        input.dataset.r = r;
        input.dataset.c = c;
        inputs[r + ',' + c] = input;
        cell.appendChild(input);
        // a small pen on the highlighted cell opens its notes
        const pen = document.createElement('button');
        pen.type = 'button';
        pen.className = 'pen';
        pen.tabIndex = -1;
        pen.setAttribute('aria-label', 'Open notes for field ' + coord(r, c));
        pen.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5l.7-3L10.8 3a1.4 1.4 0 0 1 2 0l.2.2a1.4 1.4 0 0 1 0 2L5.5 12.8z"/><path d="M9.6 4.2l2.2 2.2"/></svg>';
        pen.addEventListener('click', () => openNotes(r + ',' + c, cell));
        cell.appendChild(pen);

    }
  }

  const boardEl = document.querySelector('.board');
  const files = document.createElement('div');
  files.className = 'files';
  files.setAttribute('aria-hidden', 'true');
  const ranks = document.createElement('div');
  ranks.className = 'ranks';
  ranks.setAttribute('aria-hidden', 'true');
  for (let i = 1; i <= N; i++) {
    files.appendChild(Object.assign(document.createElement('span'), { textContent: FILES[i - 1] }));
    ranks.appendChild(Object.assign(document.createElement('span'), { textContent: ROWS_FROM_TOP ? i : N + 1 - i }));
  }
  boardEl.append(files, ranks);

  const focusAt = (r, c) => { const i = inputs[r + ',' + c]; if (i) { i.focus(); i.select(); return true; } return false; };

  grid.addEventListener('keydown', e => {
    const t = e.target;
    if (t.tagName !== 'INPUT') return;
    const r = +t.dataset.r, c = +t.dataset.c;
    const dirs = { ArrowUp: [-1,0], ArrowDown: [1,0], ArrowLeft: [0,-1], ArrowRight: [0,1] };
    if (dirs[e.key]) {
      e.preventDefault();
      let [dr, dc] = dirs[e.key], nr = r + dr, nc = c + dc;
      while (nr >= 1 && nr <= N && nc >= 1 && nc <= N && !open(nr, nc)) { nr += dr; nc += dc; }
      focusAt(nr, nc);
    } else if (e.key === 'Backspace' && !t.value) {
      e.preventDefault();
      focusAt(r, c - 1);
    }
  });
  grid.addEventListener('input', e => {
    const t = e.target;
    if (t.value) focusAt(+t.dataset.r, +t.dataset.c + 1);
    syncLetters();
    saveState();
    emitLetter(t.dataset.r + ',' + t.dataset.c);
  });
  grid.addEventListener('focusin', e => e.target.select && e.target.select());

  /* ---------- parsing ----------
     Compass names become numpad digits:  7 8 9 / 4 5 6 / 1 2 3  (5 = stay).
     An arrow is one or two moves (two = dotted or bent arrow). It lands on one
     field, and that field's letter belongs to the arrow. */
  const COMPASS = { n: '8', ne: '9', e: '6', se: '3', s: '2', sw: '1', w: '4', nw: '7' };
  const STEP = {
    8: [-1, 0], 9: [-1, 1], 6: [0, 1], 3: [1, 1],
    2: [1, 0],  1: [1, -1], 4: [0, -1], 7: [-1, -1], 5: [0, 0],
  };

  function parseArrow(raw) {
    if (raw === "'") return { tick: true, code: '' };
    if (raw === '.') return { code: '5' };
    const parts = raw.match(/nw|ne|sw|se|n|e|s|w/g) || [];
    if (parts.join('') !== raw) throw new Error('Cannot read arrow "' + raw + '"');
    return { code: parts.map(p => COMPASS[p]).join('') };
  }

  // Reads arrows from "body" (words split by "/") and walks them from "start",
  // giving every arrow the field it lands on. "label" names the path in errors.
  function walkWords(body, start, label) {
    let [r, c] = start;
    return body.split('/').map(w => w.trim().split(/\s+/).filter(Boolean).map(tok => {
      const a = parseArrow(tok);
      if (!a.tick) {
        for (const d of a.code) {
          r += STEP[d][0]; c += STEP[d][1];
          if (r < 1 || r > N || c < 1 || c > N) throw new Error(label + ' leaves the grid at "' + tok + '".');
        }
        if (isBlack(r, c)) throw new Error(label + ' lands on a black square at "' + tok + '".');
        a.land = [r, c];
      }
      return a;
    })).filter(w => w.length);
  }

  function parseSet(raw) {
    const chunks = raw.split(/(\d+)\./);   // [preamble, num, body, num, body, ...]
    if (raw.trim() && chunks.length < 3) throw new Error('No path labels like "1." found.');
    const paths = [];
    for (let i = 1; i < chunks.length; i += 2) {
      const num = +chunks[i];
      if (!cellOfNumber[num]) throw new Error('The grid has no clue number ' + num + '.');
      const start = cellOfNumber[num];
      paths.push({ num, start, words: walkWords(chunks[i + 1], start, 'Path ' + num) });
    }
    return paths;
  }

  // The title has no clue number. Its start is the one field the whole route fits from,
  // unless the text begins with a clue number ("24.") that names the start.
  function parseTitle(raw) {
    const m = raw.match(/^\s*(\d+)\.([\s\S]*)$/);
    const body = m ? m[2] : raw;
    body.split(/[\s/]+/).filter(Boolean).forEach(parseArrow);   // report unreadable arrows first
    if (!body.trim()) return [];
    let start;
    if (m) {
      start = cellOfNumber[+m[1]];
      if (!start) throw new Error('The grid has no clue number ' + m[1] + '.');
    } else {
      const fits = [];
      for (let r = 1; r <= N; r++) for (let c = 1; c <= N; c++) {
        if (!open(r, c)) continue;
        try { walkWords(body, [r, c], 'Title'); fits.push([r, c]); } catch { /* does not fit from here */ }
      }
      if (fits.length !== 1) throw new Error(fits.length
        ? 'The title fits from ' + fits.length + ' fields. Begin the text with a clue number such as "24." to choose one.'
        : 'The title does not fit on the grid from any start.');
      start = fits[0];
    }
    return [{ num: 0, title: true, start, words: walkWords(body, start, 'Title') }];
  }
  const PARSERS = { setA: parseSet, setB: parseSet, setT: parseTitle };

  /* ---------- glyph drawing (svg, screen coords, y down) ---------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs, parent) => {
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const unit = d => { const [dr, dc] = STEP[d]; const l = Math.hypot(dr, dc) || 1; return [dc / l, dr / l]; };

  function chevron(parent, x, y, ux, uy, size, width) {
    const a = 0.72;
    for (const s of [1, -1]) {
      const cx = Math.cos(a * s), sx = Math.sin(a * s);
      const bx = -(ux * cx - uy * sx), by = -(ux * sx + uy * cx);
      el('line', { x1: x, y1: y, x2: x + bx * size, y2: y + by * size, 'stroke-width': width }, parent);
    }
  }

  function glyph(arrow) {
    const svg = el('svg', { viewBox: '0 0 32 32', fill: 'none', stroke: 'currentColor', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    if (arrow.tick) {
      svg.setAttribute('viewBox', '0 0 14 32');
      el('line', { x1: 5, y1: 12, x2: 8, y2: 7, 'stroke-width': 1.6 }, svg);
      return svg;
    }
    if (arrow.code === '5') {
      el('circle', { cx: 16, cy: 16, r: 2.6, fill: 'currentColor', stroke: 'none' }, svg);
      return svg;
    }
    const single = arrow.code.length === 1;
    const len = single ? 22 : 11;
    const pts = [[0, 0]];
    let ux = 0, uy = 0;
    for (const d of arrow.code) {
      [ux, uy] = unit(d);
      const [px, py] = pts[pts.length - 1];
      pts.push([px + ux * len, py + uy * len]);
    }
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const ox = 16 - (Math.min(...xs) + Math.max(...xs)) / 2;
    const oy = 16 - (Math.min(...ys) + Math.max(...ys)) / 2;
    const P = pts.map(([x, y]) => [x + ox, y + oy]);
    el('polyline', { points: P.map(p => p.join(',')).join(' '), 'stroke-width': 2 }, svg);
    const [ex, ey] = P[P.length - 1];
    chevron(svg, ex, ey, ux, uy, 7, 2);
    if (!single) el('circle', { cx: P[1][0], cy: P[1][1], r: 2.4, fill: 'currentColor', stroke: 'none' }, svg);
    return svg;
  }

  /* ---------- panels ---------- */
  const sets = { setA: [], setB: [], setT: [] };     // listId -> parsed paths

  // Re-reads the input text of one column and rebuilds its rows. A text that
  // cannot be read leaves the last good rows in place and shows the reason.
  function renderSet(listId, raw) {
    const list = document.getElementById(listId);
    const empty = list.nextElementSibling;
    const box = document.getElementById('raw' + listId.slice(3));
    const err = document.getElementById('err' + listId.slice(3));
    let paths;
    try {
      paths = raw.trim() ? PARSERS[listId](raw) : [];
    } catch (e) {
      err.textContent = e.message;
      box.setAttribute('aria-invalid', 'true');
      return;
    }
    err.textContent = '';
    box.removeAttribute('aria-invalid');
    sets[listId] = paths;
    list.replaceChildren();
    empty.hidden = paths.length > 0;
    paths.forEach(path => {
      const li = document.createElement('li');
      const btn = document.createElement('div');
      btn.className = 'path' + (path.title ? ' title' : '');
      btn.dataset.set = listId;
      btn.dataset.num = path.num;
      const label = document.createElement('button');
      label.className = 'label';
      label.type = 'button';
      label.setAttribute('aria-pressed', 'false');
      label.setAttribute('aria-label', path.title ? 'Show the title on the grid' : 'Show path ' + path.num + ' on the grid');
      label.textContent = path.title ? 'Title' : path.num + '.';
      const words = document.createElement('span');
      words.className = 'words';
      for (const w of path.words) {
        const word = document.createElement('span');
        word.className = 'word';
        for (const a of w) {
          const g = document.createElement('span');
          g.className = 'g' + (a.tick ? ' tick' : '');
          g.appendChild(glyph(a));
          if (!a.tick) {
            const L = document.createElement('input');
            L.className = 'letter';
            L.maxLength = 1;
            L.autocomplete = 'off';
            L.spellcheck = false;
            L.dataset.key = a.land.join(',');
            L.setAttribute('aria-label', 'Letter of field ' + coord(...a.land));
            g.appendChild(L);
            g.appendChild(Object.assign(document.createElement('span'), { className: 'coord', textContent: coord(...a.land) }));
          } else {
            g.appendChild(Object.assign(document.createElement('span'), { className: 'letter', style: 'border-color:transparent' }));
          }
          word.appendChild(g);
        }
        words.appendChild(word);
      }

      // the solution: the grid entry that starts at this number, read in the column's direction
      const body = document.createElement('div');
      body.className = 'body';
      const solution = document.createElement('span');
      solution.className = 'solution';
      const [sr, sc] = path.start;
      const [dr, dc] = listId === 'setA' ? [0, 1] : [1, 0];   // left column reads across, right column down
      for (let r = sr, c = sc; !path.title && open(r, c); r += dr, c += dc) {
        const g = document.createElement('span');
        g.className = 'g sol';
        const L = document.createElement('input');
        L.className = 'letter';
        L.maxLength = 1;
        L.autocomplete = 'off';
        L.spellcheck = false;
        L.dataset.key = r + ',' + c;
        L.setAttribute('aria-label', 'Solution letter of field ' + coord(r, c));
        g.append(L, Object.assign(document.createElement('span'), { className: 'coord', textContent: coord(r, c) }));
        solution.appendChild(g);
      }
      body.append(words, ...(path.title ? [] : [solution]));   // the title's hint is its solution

      const fold = document.createElement('button');
      fold.className = 'fold';
      fold.type = 'button';
      fold.innerHTML = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
      const lead = document.createElement('div');
      lead.className = 'lead';
      lead.append(label, ...(path.title ? [] : [fold]));
      btn.append(lead, body);
      if (!path.title) setFolded(btn, collapsed.has(listId + ':' + path.num));
      li.appendChild(btn);
      list.appendChild(li);
    });

    // keep selections whose path still exists, drop the others and free their colour
    for (const [key, sel] of [...selected]) {
      if (sel.listId !== listId) continue;
      const row = list.querySelector(`.path[data-num="${sel.num}"]`);
      if (row) setRowState(row, sel.color); else selected.delete(key);
    }
    syncLetters();
    draw();
    highlight(hlKey);   // the rows were rebuilt, so mark the current field again
  }

  // Folding hides the hint arrows and letters and leaves only the solution.
  function setFolded(row, folded) {
    row.classList.toggle('collapsed', folded);
    const fold = row.querySelector('.fold');
    fold.setAttribute('aria-expanded', String(!folded));
    const text = folded ? 'Show the hint' : 'Show only the solution';
    fold.title = text;
    fold.setAttribute('aria-label', text + ', path ' + row.dataset.num);
  }

  function syncLetters() {
    document.querySelectorAll('.letter[data-key]').forEach(L => {
      const i = inputs[L.dataset.key];
      if (i && L.value !== i.value) L.value = i.value;
    });
  }

  // typing under an arrow writes the grid cell, then every view of that cell follows
  document.addEventListener('input', e => {
    const L = e.target;
    if (!L.matches('input.letter')) return;
    inputs[L.dataset.key].value = L.value;
    syncLetters();
    saveState();
    emitLetter(L.dataset.key);
    if (L.value) stepLetter(L, 1);
  });
  document.addEventListener('keydown', e => {
    const L = e.target;
    if (!L.matches || !L.matches('input.letter')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stepLetter(L, 1); }
    else if (e.key === 'ArrowLeft' || (e.key === 'Backspace' && !L.value)) { e.preventDefault(); stepLetter(L, -1); }
  });
  function stepLetter(L, dir) {
    const group = L.closest('.words, .solution');
    const all = [...group.querySelectorAll('input.letter')];
    const next = all[all.indexOf(L) + dir];
    if (next) { next.focus(); next.select(); }
  }
  // Focusing a grid cell or a letter field marks that coordinate everywhere:
  // the cell itself and every hint and solution letter that points at it.
  let hlKey = null;   // the last field you were in; it stays marked until you pick another
  function highlight(key) {
    hlKey = key;
    document.querySelectorAll('.xhl').forEach(x => x.classList.remove('xhl'));
    if (!key) return;
    cells[key].classList.add('xhl');
    document.querySelectorAll(`input.letter[data-key="${key}"]`).forEach(L => {
      L.classList.add('xhl');
      L.parentElement.classList.add('xhl');
    });
  }
  const keyOf = el => el.matches('#grid input') ? el.dataset.r + ',' + el.dataset.c : el.matches('input.letter') ? el.dataset.key : null;
  document.addEventListener('focusin', e => {
    if (!e.target.matches) return;
    const key = keyOf(e.target);
    if (e.target.matches('input.letter')) e.target.select();
    if (key) highlight(key);
  });

  /* ---------- selecting a path ---------- */
  const overlay = document.getElementById('overlay');
  const board = document.querySelector('.board');
  const CELL_PAD = 0.10;  // share of a cell kept free on every side
  const CHAIN = false;    // false: an arrow lands at the offset it left from (parallel lines);
                          // true: it lands one step further along, so lines join end to end
  const PALETTE = ['#2447e8', '#1f9d55', '#e8780c', '#c2338f', '#0e9aa7', '#d93a3a', '#7a3fe0', '#a8800a'];
  // Words of one path share its colour family: same look, nudged in hue and lightness.
  const SUB_SHIFTS = [[-20, 0], [20, 0], [-10, 9], [10, -9], [-30, -7], [30, 7]];
  function hexToHsl(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    let h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60;
    }
    const sat = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    return [(h + 360) % 360, sat * 100, l * 100];
  }
  function wordColors(color, count) {
    if (count < 2) return [color];     // a single word keeps the main colour
    const [h, s, l] = hexToHsl(color);
    return Array.from({ length: count }, (_, i) => {
      const [dh, dl] = SUB_SHIFTS[i % SUB_SHIFTS.length];
      return `hsl(${Math.round((h + dh + 360) % 360)} ${Math.round(s)}% ${Math.round(Math.min(80, Math.max(25, l + dl)))}%)`;
    });
  }
  const MODES = ['diagonal', 'direction', 'small', 'big'];
  const VIEW_DEFAULT = { round: 1, thick: 1, transp: 10, mode: 'diagonal', size: 100 };   // roundness and thickness are multipliers, transparency is a percent
  const view = { ...VIEW_DEFAULT };
  const collapsed = new Set();   // "listId:num" of rows folded down to their solution
  const selected = new Map();   // "listId:num" -> { listId, num, color }, in selection order

  const freeColor = () => {
    const used = new Set([...selected.values()].map(x => x.color));
    return PALETTE.find(c => !used.has(c));
  };

  function clearHits() {
    Object.values(cells).forEach(e => { e.style.background = ''; e.style.boxShadow = ''; });
    overlay.replaceChildren();
  }

  // repeatable pseudo-random number in [0, 1) for the same three inputs
  const rand = (a, b, c) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
  const mix = (color, pct, base) => `color-mix(in srgb, ${color} ${pct}%, ${base})`;

  function draw() {
    clearHits();
    const marks = {};   // cell key -> [{ color, land }]
    const rings = {};   // cell key -> [color] for start cells
    const mark = (cr, cc, color, land) => {
      const list = marks[cr + ',' + cc] || (marks[cr + ',' + cc] = []);
      const own = list.find(m => m.color === color);
      if (own) own.land = own.land || land; else list.push({ color, land });
    };

    const w = board.offsetWidth, h = board.offsetHeight;
    overlay.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const cellPx = w / N, sw = Math.max(1.5, cellPx * 0.04 * view.thick);
    const anchor = (cr, cc, t) => {
      const e = cells[cr + ',' + cc];
      const pad = e.offsetWidth * CELL_PAD, span = e.offsetWidth - 2 * pad;
      return [e.offsetLeft + pad + t * span, e.offsetTop + pad + t * span];
    };

    for (const { listId, num, color } of selected.values()) {
      const path = sets[listId].find(p => p.num === num);
      let [r, c] = path.start;
      const start = [r, c];
      const cols = wordColors(color, path.words.length);
      // the start field is not part of the hint, so it is neither tinted nor drawn from
      const steps = [];                       // one per letter: { from, to, w }
      path.words.forEach((word, w) => { for (const a of word) {
        if (a.tick) continue;
        const from = [r, c];
        for (const d of a.code) { r += STEP[d][0]; c += STEP[d][1]; if (steps.length) mark(r, c, cols[w], false); }
        mark(r, c, cols[w], true);
        steps.push({ from, to: [r, c], w });
      } });
      if (steps.length) { const k0 = steps[0].to.join(','); (rings[k0] = rings[k0] || []).push(color); }   // the ring marks where the hint begins

      // Straight line from where an arrow leaves its cell to where it lands in the next.
      // Both points slide along the cell's top-left to bottom-right diagonal with the
      // letter index, so repeated visits to a cell never share a spot.
      const g = el('g', { fill: 'none', stroke: cols[0], 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 1 - view.transp / 100 }, overlay);
      const n = steps.length;

      // Nodes in travel order: leave a cell, land in the next, slide along that cell's
      // diagonal to the next leaving spot, and so on. The whole route is one smooth line.
      const nodes = [];
      const direct = view.mode === 'direction';
      const add = (pt, land, w) => {
        const last = nodes[nodes.length - 1];
        if (last && Math.hypot(pt[0] - last.x, pt[1] - last.y) < 1) { if (land) last.stay = true; return; }
        nodes.push({ x: pt[0], y: pt[1], land, w, brk: direct && !land });   // in direction mode every arrow stands alone
      };

      // Where an arrow leaves its cell and where it lands, by mode:
      //   diagonal   a spot sliding from top left to bottom right with the letter index
      //   small/big  a repeatable random spot inside the middle third / the inner 80% of the cell
      //   direction  the cell centre, pulled back to the edge of an invisible circle towards the other end
      const box = (cr, cc) => { const e = cells[cr + ',' + cc]; return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth }; };
      const spot = (cell, lo, hi, k, seed) => {
        const b = box(cell[0], cell[1]);
        return [b.x + b.w * (lo + (hi - lo) * rand(path.num, k, seed)), b.y + b.w * (lo + (hi - lo) * rand(path.num, k, seed + 1))];
      };
      const R = cellPx * 0.27;
      const cut = (k, atStart) => {
        const f = box(steps[k].from[0], steps[k].from[1]), t = box(steps[k].to[0], steps[k].to[1]);
        const [fx, fy] = [f.x + f.w / 2, f.y + f.w / 2], [tx, ty] = [t.x + t.w / 2, t.y + t.w / 2];
        const d = Math.hypot(tx - fx, ty - fy);
        if (d < 1) return [fx, fy];
        const ux = (tx - fx) / d, uy = (ty - fy) / d;
        return atStart ? [fx + ux * R, fy + uy * R] : [tx - ux * R, ty - uy * R];
      };
      const RANGE = { small: [0.33, 0.66], big: [0.1, 0.9] };
      const depPos = k => direct ? cut(k, true)
        : RANGE[view.mode] ? spot(steps[k].from, ...RANGE[view.mode], k, 11)
        : anchor(steps[k].from[0], steps[k].from[1], k / n);
      const landPos = k => direct ? cut(k, false)
        : RANGE[view.mode] ? spot(steps[k].to, ...RANGE[view.mode], k, 13)
        : anchor(steps[k].to[0], steps[k].to[1], (CHAIN ? k + 1 : k) / n);

      steps.forEach(({ w }, k) => {
        if (k === 0) {
          // the route begins on the first landing field; there is no arrow into it
          const b = box(steps[0].to[0], steps[0].to[1]);
          add(direct ? [b.x + b.w / 2, b.y + b.w / 2] : landPos(0), true, w);
          nodes[0].first = true;
        } else add(landPos(k), true, w);
        if (k + 1 < n) add(depPos(k + 1), false, steps[k + 1].w);
      });

      // One tangent per node is shared by the segment arriving and the one leaving, so the
      // line has no kinks. Roundness blends from "follow the chords" (0) to fully smooth (1),
      // and beyond 1 it lengthens the handles. A repeatable twist per node keeps it hand-drawn.
      const norm = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
      const dir = (p, q) => norm([q.x - p.x, q.y - p.y]);
      const rot = (v, t) => [v[0] * Math.cos(t) - v[1] * Math.sin(t), v[0] * Math.sin(t) + v[1] * Math.cos(t)];
      const m = Math.min(view.round, 1);
      if (nodes.length > 1) nodes.forEach((p, i) => {
        const cin = i > 0 && !p.brk ? dir(nodes[i - 1], p) : null;
        const cout = i < nodes.length - 1 && !nodes[i + 1].brk ? dir(p, nodes[i + 1]) : null;
        if (!cin && !cout) { p.tin = p.tout = [1, 0]; return; }   // a lone point, e.g. a stay between two cut arrows
        let smooth = cin && cout ? [cin[0] + cout[0], cin[1] + cout[1]] : (cin || cout);
        if (Math.hypot(smooth[0], smooth[1]) < 0.2) smooth = [-cout[1], cout[0]];   // a straight reversal
        smooth = norm(smooth);
        const blend = c => c ? norm([c[0] + (smooth[0] - c[0]) * m, c[1] + (smooth[1] - c[1]) * m]) : smooth;
        const twist = (rand(path.num, i, 5) - 0.5) * 0.9 * Math.min(view.round, 1.5);
        p.tin = rot(blend(cin), twist);
        p.tout = rot(blend(cout), twist);
      });

      if (nodes.length > 1) {
        const reach = 0.33 * (view.round > 1 ? 1 + (view.round - 1) * 1.2 : 1);
        let dstr = '', lastW = -1;
        const flush = () => { if (dstr) el('path', { d: dstr, stroke: cols[lastW] }, g); dstr = ''; };
        for (let i = 0; i < nodes.length - 1; i++) {
          const p = nodes[i], q = nodes[i + 1];
          if (q.brk) { flush(); lastW = -1; continue; }
          if (q.w !== lastW) { flush(); lastW = q.w; dstr = `M${p.x},${p.y}`; }
          const d = Math.hypot(q.x - p.x, q.y - p.y);
          const h1 = d * reach * (1 + (rand(path.num, i, 6) - 0.5) * 0.6 * m);
          const h2 = d * reach * (1 + (rand(path.num, i, 7) - 0.5) * 0.6 * m);
          dstr += ` C${p.x + p.tout[0] * h1},${p.y + p.tout[1] * h1} ${q.x - q.tin[0] * h2},${q.y - q.tin[1] * h2} ${q.x},${q.y}`;
        }
        flush();
      }
      const head = cellPx * 0.12 * (0.75 + 0.25 * view.thick);
      nodes.forEach(p => {
        const wc = { stroke: cols[p.w] };
        if (p.stay) el('circle', { cx: p.x, cy: p.y, r: cellPx * 0.07, ...wc }, g);
        else if (p.land && !p.first) { const hg = el('g', wc, g); chevron(hg, p.x, p.y, p.tin[0], p.tin[1], head, sw); }
      });
      if (nodes.length) el('circle', { cx: nodes[0].x, cy: nodes[0].y, r: cellPx * 0.06, fill: color, stroke: 'none' }, g);
    }

    // cells shared by several paths are split into diagonal stripes, one per colour
    for (const [key, list] of Object.entries(marks)) {
      const black = cells[key].classList.contains('black');
      const tones = list.map(m => black ? mix(m.color, m.land ? 80 : 60, '#131a2b') : mix(m.color, m.land ? 45 : 20, '#f6f2f1'));
      cells[key].style.background = tones.length === 1 ? tones[0]
        : `linear-gradient(135deg, ${tones.map((t, i) => `${t} ${i * 100 / tones.length}% ${(i + 1) * 100 / tones.length}%`).join(', ')})`;
    }
    for (const [key, colors] of Object.entries(rings)) {
      cells[key].style.boxShadow = colors.map((c, i) => `inset 0 0 0 ${3 * (i + 1)}px ${c}`).join(', ');
    }
  }

  function select(row) {
    if (!row) {
      selected.clear();
      document.querySelectorAll('.path.active').forEach(r => setRowState(r, null));
      draw();
      return;
    }
    const key = row.dataset.set + ':' + row.dataset.num;
    if (selected.has(key)) {
      selected.delete(key);
      setRowState(row, null);
    } else {
      const color = freeColor();
      if (!color) return;    // every colour is in use: deselect a path first
      selected.set(key, { listId: row.dataset.set, num: +row.dataset.num, color });
      setRowState(row, color);
    }
    draw();
  }

  function setRowState(row, color) {
    row.classList.toggle('active', !!color);
    if (color) row.style.setProperty('--pc', color); else row.style.removeProperty('--pc');
    row.querySelector('.label').setAttribute('aria-pressed', String(!!color));
    const words = row.querySelectorAll('.word');
    const cols = color ? wordColors(color, words.length) : [];
    words.forEach((w, i) => { if (color) w.style.setProperty('--wc', cols[i]); else w.style.removeProperty('--wc'); });
  }

  document.addEventListener('click', e => {
    if (e.target.matches('input.letter')) return;
    const row = e.target.closest('.path');
    if (!row) return;
    if (e.target.closest('.fold')) {
      const key = row.dataset.set + ':' + row.dataset.num;
      const folded = !collapsed.has(key);
      if (folded) collapsed.add(key); else collapsed.delete(key);
      setFolded(row, folded);
      saveState();
      return;
    }
    select(row);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!noteBox.hidden) { closeNotes(); return; }
    if (!settingsPanel.hidden) { toggleSettings(false); settingsBtn.focus(); return; }
    if (selected.size && e.target.tagName !== 'TEXTAREA') select(null);
  });

  /* ---------- notes ----------
     Every white cell has nine note slots (a 3x3 array). Right-click a cell, or any letter box that
     points at it, to open the cell enlarged and type into the slots. A slot is saved as "r,c#slot". */
  const notes = {};
  let showNotes = true;   // the global switch in settings: off hides notes and turns off opening them
  const noteKey = (key, i) => key + '#' + i;

  function paintNotes(key) {
    const layer = cells[key] && cells[key].querySelector('.notes');
    if (layer) [...layer.children].forEach((sp, i) => { sp.textContent = notes[noteKey(key, i)] || ''; });
  }

  function setNote(slotKey, value, emit) {
    const v = String(value).slice(0, 1);
    if ((notes[slotKey] || '') === v) return;
    if (v) notes[slotKey] = v; else delete notes[slotKey];
    const [key, slot] = slotKey.split('#');
    paintNotes(key);
    if (openNote && openNote.key === key) noteInputs[+slot].value = v;
    saveState();
    if (emit && sync.onNote) sync.onNote(slotKey, v);
  }

  const noteBox = document.createElement('div');
  noteBox.id = 'noteBox';
  noteBox.hidden = true;
  noteBox.setAttribute('role', 'dialog');
  const noteInputs = Array.from({ length: 9 }, (_, i) => {
    const inp = document.createElement('input');
    inp.className = 'note';
    inp.maxLength = 1;
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.dataset.slot = i;
    return inp;
  });
  const noteClose = Object.assign(document.createElement('button'), { type: 'button', className: 'nclose', textContent: '×' });
  noteClose.setAttribute('aria-label', 'Close notes');
  const noteTag = Object.assign(document.createElement('span'), { className: 'ntag' });
  noteBox.append(...noteInputs, noteClose, noteTag);
  document.body.appendChild(noteBox);
  let openNote = null;   // { key } while the enlarged cell is showing

  function openNotes(key, anchor) {
    const size = Math.min(cells[key].offsetWidth * 4, innerWidth - 60, innerHeight - 80);
    const r = anchor.getBoundingClientRect();
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    Object.assign(noteBox.style, {
      width: size + 'px',
      height: size + 'px',
      left: clamp(r.left + r.width / 2 - size / 2, 24, innerWidth - size - 24) + 'px',
      top: clamp(r.top + r.height / 2 - size / 2, 36, innerHeight - size - 24) + 'px',
      fontSize: size / 3 * 0.55 + 'px',
    });
    const [rr, cc] = key.split(',').map(Number);
    noteTag.textContent = coord(rr, cc);
    noteBox.setAttribute('aria-label', 'Notes for field ' + coord(rr, cc));
    noteInputs.forEach((inp, i) => { inp.value = notes[noteKey(key, i)] || ''; });
    openNote = { key };
    noteBox.hidden = false;
    highlight(key);
    noteInputs[0].focus();
  }
  function closeNotes() {
    noteBox.hidden = true;
    openNote = null;
  }

  noteClose.addEventListener('click', closeNotes);
  document.addEventListener('contextmenu', e => {
    const t = e.target;
    if (!showNotes || !t.matches || !(t.matches('#grid input') || t.matches('input.letter'))) return;
    e.preventDefault();
    const key = keyOf(t);
    openNotes(key, t.matches('#grid input') ? cells[key] : t);
  });
  document.addEventListener('pointerdown', e => { if (!noteBox.hidden && !noteBox.contains(e.target)) closeNotes(); });
  noteBox.addEventListener('focusin', e => { if (e.target.select) e.target.select(); });
  noteBox.addEventListener('input', e => {
    const i = +e.target.dataset.slot;
    setNote(noteKey(openNote.key, i), e.target.value, true);
    if (e.target.value && i < 8) noteInputs[i + 1].focus();
  });
  noteBox.addEventListener('keydown', e => {
    const i = +e.target.dataset.slot;
    if (Number.isNaN(i)) return;
    const move = { ArrowLeft: i % 3 ? i - 1 : i, ArrowRight: i % 3 < 2 ? i + 1 : i, ArrowUp: i >= 3 ? i - 3 : i, ArrowDown: i < 6 ? i + 3 : i };
    if (e.key in move) { e.preventDefault(); noteInputs[move[e.key]].focus(); }
    else if (e.key === 'Backspace' && !e.target.value && i > 0) { e.preventDefault(); noteInputs[i - 1].focus(); }
  });

  /* ---------- live sync between windows ----------
     Only grid letters travel. The sync module at the bottom of the page (Yjs, with Trystero
     as the peer-to-peer link) plugs into this small interface once its libraries have loaded. */
  // A browser without a saved room code makes up its own, six characters without look-alikes.
  const randomRoom = () => {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from(crypto.getRandomValues(new Uint8Array(6)), b => alphabet[b % alphabet.length]).join('');
  };
  const sync = {
    room: randomRoom(),
    onLetter: null,    // (key, value) => void, set by the sync module
    onNote: null,      // (slotKey, value) => void, set by the sync module
    onRoom: null,      // (room) => void, set by the sync module
    status: text => { document.getElementById('roomStatus').textContent = text; },
  };
  const emitLetter = key => { if (sync.onLetter) sync.onLetter(key, inputs[key].value); };
  window.arrows = {
    sync,
    letters: () => Object.fromEntries(Object.entries(inputs).filter(([, i]) => i.value).map(([k, i]) => [k, i.value])),
    notes: () => ({ ...notes }),
    setNote: (slotKey, value) => setNote(slotKey, value, false),
    // a letter that arrived from another window: show it and keep it, without sending it back
    setLetter(key, value) {
      const i = inputs[key];
      if (!i || i.value === value) return;
      i.value = String(value).slice(0, 1);
      syncLetters();
      saveState();
    },
  };

  /* ---------- saved edits ----------
     Codes and typed letters live in this browser's localStorage. Without it
     (private window, blocked storage) the page still works, it just forgets. */
  const STORE_KEY = 'arrows-puzzle-v1';
  const DEFAULTS = { setT: RAW_T.trim(), setA: RAW_A.trim(), setB: RAW_B.trim() };

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function saveState() {
    const letters = {};
    for (const [key, i] of Object.entries(inputs)) if (i.value) letters[key] = i.value;
    const codes = {};
    for (const id of Object.keys(DEFAULTS)) codes[id] = document.getElementById('raw' + id.slice(3)).value;
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ codes, letters, view, collapsed: [...collapsed], room: sync.room, notes, showNotes })); } catch { /* storage unavailable */ }
  }

  const saved = loadState();
  if (typeof saved.showNotes === 'boolean') showNotes = saved.showNotes;
  if (typeof saved.room === 'string') sync.room = saved.room;   // no saved room (first visit, older saves): keep the random one
  for (const k of saved.collapsed || []) if (typeof k === 'string') collapsed.add(k);
  for (const k of Object.keys(VIEW_DEFAULT)) {
    const v = saved.view && saved.view[k];
    if (k === 'mode' ? MODES.includes(v) : (typeof v === 'number' && isFinite(v))) view[k] = k === 'size' ? Math.min(100, Math.max(50, v)) : v;
  }
  for (const [slotKey, v] of Object.entries(saved.notes || {})) {
    const key = slotKey.split('#')[0];
    if (cells[key] && !cells[key].classList.contains('black') && typeof v === 'string' && v) { notes[slotKey] = v.slice(0, 1); paintNotes(key); }
  }
  for (const [key, v] of Object.entries(saved.letters || {})) if (inputs[key] && typeof v === 'string') inputs[key].value = v.slice(0, 1);

  /* ---------- settings menu ---------- */
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const SLIDERS = [
    { key: 'size', input: 'setSize', out: 'outSize', show: v => Math.round(v) + '%' },
    { key: 'round', input: 'setRound', out: 'outRound', show: v => Math.round(v * 100) + '%' },
    { key: 'thick', input: 'setThick', out: 'outThick', show: v => Math.round(v * 100) + '%' },
    { key: 'transp', input: 'setTransp', out: 'outTransp', show: v => Math.round(v) + '%' },
  ];
  const applyScale = () => document.documentElement.style.setProperty('--scale', view.size / 100);
  function showSliders() {
    applyScale();
    document.querySelectorAll('input[name="mode"]').forEach(r => { r.checked = r.value === view.mode; });
    for (const { key, input, out, show } of SLIDERS) {
      document.getElementById(input).value = view[key];
      document.getElementById(out).textContent = show(view[key]);
    }
  }
  for (const { key, input, out, show } of SLIDERS) {
    document.getElementById(input).addEventListener('input', e => {
      view[key] = +e.target.value;
      applyScale();
      document.getElementById(out).textContent = show(view[key]);
      draw();
      saveState();
    });
  }
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => {
    if (!r.checked) return;
    view.mode = r.value;
    draw();
    saveState();
  }));
  document.getElementById('setDefault').addEventListener('click', () => {
    Object.assign(view, VIEW_DEFAULT);
    showSliders();
    draw();
    saveState();
  });
  const roomInput = document.getElementById('setRoom');
  roomInput.value = sync.room;
  roomInput.addEventListener('change', () => {
    sync.room = roomInput.value.trim();
    roomInput.value = sync.room;
    saveState();
    if (sync.onRoom) sync.onRoom(sync.room);
  });
  sync.status(sync.room ? 'Starting sync…' : 'Sync is off.');

  const notesToggle = document.getElementById('setNotes');
  const applyNotes = () => {
    document.body.classList.toggle('notes-off', !showNotes);
    notesToggle.checked = showNotes;
    if (!showNotes) closeNotes();
  };
  notesToggle.addEventListener('change', () => { showNotes = notesToggle.checked; applyNotes(); saveState(); });
  applyNotes();

  const toggleSettings = open => {
    settingsPanel.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', String(open));
  };
  settingsBtn.addEventListener('click', () => toggleSettings(settingsPanel.hidden));
  document.addEventListener('click', e => { if (!e.target.closest('.settings')) toggleSettings(false); });
  showSliders();

  for (const listId of Object.keys(DEFAULTS)) {
    const box = document.getElementById('raw' + listId.slice(3));
    const reset = document.getElementById('reset' + listId.slice(3));
    const refresh = () => { renderSet(listId, box.value); reset.disabled = box.value.trim() === DEFAULTS[listId]; };
    const savedText = saved.codes && saved.codes[listId];
    box.value = typeof savedText === 'string' ? savedText : DEFAULTS[listId];
    box.addEventListener('input', () => { refresh(); saveState(); });
    reset.addEventListener('click', () => {
      if (!confirm('Reset this column\'s codes to the defaults? Your edits to them will be lost.')) return;
      box.value = DEFAULTS[listId];
      refresh();
      saveState();
    });
    refresh();
  }

  saveState();   // keeps a freshly made room code for the next visit
  new ResizeObserver(() => draw()).observe(board);
</script>
<script type="module">
  // Letters are kept in a Yjs map (one entry per field, '' when cleared). Yjs merges edits from
  // every window, and Trystero carries the updates peer to peer; the public Nostr relays it uses
  // only introduce the browsers to each other, no letters pass through them.
  const api = window.arrows;
  const REMOTE = 'remote';
  let Y, joinRoom;
  try {
    [Y, { joinRoom }] = await Promise.all([import('https://esm.sh/yjs@13.6.27'), import('https://esm.sh/trystero@0.25.4')]);
  } catch (err) {
    api.sync.status('Sync is unavailable: its libraries could not be loaded.');
  }

  let doc = null, room = null;
  const peers = new Set();

  function show(code) {
    if (!code) return api.sync.status('Sync is off.');
    api.sync.status(peers.size
      ? `Connected to ${peers.size} other ${peers.size === 1 ? 'window' : 'windows'}.`
      : 'Waiting for another window with the same code.');
  }

  function disconnect() {
    if (room) room.leave();
    if (doc) doc.destroy();
    room = doc = null;
    peers.clear();
    api.sync.onLetter = null;
    api.sync.onNote = null;
  }

  function connect(code) {
    disconnect();
    if (!Y || !code) return show(code);
    doc = new Y.Doc();
    const letters = doc.getMap('letters');
    // a clear is stored as '' so that it wins over an old letter in another window
    const noteMap = doc.getMap('notes');
    const adopt = () => {
      for (const [key, v] of Object.entries(api.letters())) if (!letters.has(key)) letters.set(key, v);
      for (const [key, v] of Object.entries(api.notes())) if (!noteMap.has(key)) noteMap.set(key, v);
    };

    letters.observe((event, tr) => {
      if (tr.origin !== REMOTE) return;
      for (const key of event.keysChanged) api.setLetter(key, letters.get(key) ?? '');
    });

    noteMap.observe((event, tr) => {
      if (tr.origin !== REMOTE) return;
      for (const key of event.keysChanged) api.setNote(key, noteMap.get(key) ?? '');
    });

    room = joinRoom({ appId: 'xyl0o-arrows-puzzle-hunt' }, code);
    const channel = room.makeAction('yjs');
    doc.on('update', (update, origin) => { if (origin !== REMOTE && peers.size) channel.send(update); });
    channel.onMessage = data => { Y.applyUpdate(doc, new Uint8Array(data), REMOTE); adopt(); };
    room.onPeerJoin = id => { peers.add(id); channel.send(Y.encodeStateAsUpdate(doc), { target: id }); show(code); };
    room.onPeerLeave = id => { peers.delete(id); show(code); };

    api.sync.onLetter = (key, value) => letters.set(key, value);
    api.sync.onNote = (key, value) => noteMap.set(key, value);
    show(code);
  }

  api.sync.onRoom = connect;
  connect(api.sync.room);
</script>
